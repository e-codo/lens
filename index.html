<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дисторсия объектива</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: preview stage on the left, Figma-like inspector panel on the right; stacks on phones */
:root{
  --bg:#eceef2; --panel:#ffffff; --field:#eef0f5; --line:#d9dce5;
  --fg:#1b1e27; --muted:#6a7185; --accent:#2f7bf5; --accent-fg:#fff;
  --stage:#dfe2ea;
  --font:'Onest',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17181c; --panel:#232429; --field:#2f3037; --line:#34353d;
  --fg:#ececf0; --muted:#8e91a0; --accent:#4a97ff; --accent-fg:#06101f; --stage:#101114; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17181c; --panel:#232429; --field:#2f3037; --line:#34353d;
  --fg:#ececf0; --muted:#8e91a0; --accent:#4a97ff; --accent-fg:#06101f; --stage:#101114; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:13px;padding-inline:16px;padding-block:16px}
.app{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.stage{background:var(--stage);border-radius:14px;display:grid;place-items:center;padding:16px;min-width:0}
canvas{--ar:1.5;aspect-ratio:var(--ar);width:min(100%,calc(78vh * var(--ar)));height:auto;display:block;border-radius:4px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
h1{font-size:14px;font-weight:600;margin:0;display:flex;align-items:center;gap:8px}
h1 svg{color:var(--accent)}
.row{display:grid;grid-template-columns:92px minmax(0,1fr);align-items:center;gap:10px}
.row>label{color:var(--muted)}
.sl{display:flex;align-items:center;gap:8px}
input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:18px}
.num{width:52px;background:var(--field);border:0;border-radius:6px;color:var(--fg);font:500 12px var(--mono);padding:6px 8px;text-align:right}
.xy{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.xy div{display:flex;align-items:center;gap:6px;background:var(--field);border-radius:6px;padding:0 8px;color:var(--muted);font:12px var(--mono)}
.xy input{width:100%;min-width:0;background:none;border:0;color:var(--fg);font:500 12px var(--mono);padding:6px 0}
select{width:100%;background:var(--field);color:var(--fg);border:0;border-radius:6px;padding:7px 8px;font:inherit}
button,.btn{font:600 13px var(--font);border:0;border-radius:8px;padding:10px 12px;cursor:pointer;text-align:center}
.primary{background:var(--accent);color:var(--accent-fg)}
.ghost{background:var(--field);color:var(--fg);display:block}
.actions{display:grid;gap:8px}
.hint{color:var(--muted);font-size:12px;line-height:1.45;margin:0}
.meta{font:12px var(--mono);color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:820px){.app{grid-template-columns:minmax(0,1fr)}}
</style>
<style>html,body{margin:0}</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage"><canvas id="c" width="1200" height="800"></canvas></div>
  <aside class="panel">
    <h1><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8c3-3 6 3 9 0s6-3 9 0M3 14c3-3 6 3 9 0s6-3 9 0M3 20c3-3 6 3 9 0s6-3 9 0" transform="translate(0 -3)"/></svg>Дисторсия объектива</h1>
    <div class="row"><label for="dist">Искажение</label><div class="sl"><input id="dist" type="range" min="-1" max="1" step="0.01" value="0.5"><input class="num" id="dist_n" value="0.5" aria-label="Значение искажения"></div></div>
    <div class="row"><label for="aber">Аберрация</label><div class="sl"><input id="aber" type="range" min="0" max="1" step="0.01" value="0.2"><input class="num" id="aber_n" value="0.2" aria-label="Значение аберрации"></div></div>
    <div class="row"><label>Центр</label><div class="xy"><div>X<input id="cx" value="50%"></div><div>Y<input id="cy" value="50%"></div></div></div>
    <div class="row"><label for="mode">Режим</label><select id="mode"><option value="0">Боковая</option><option value="1">Осевая</option></select></div>
    <div class="row"><label for="qual">Качество</label><select id="qual"><option value="6">Низкое</option><option value="12" selected>Среднее</option><option value="24">Высокое</option></select></div>
    <div class="row"><label for="fit">Края</label><select id="fit"><option value="0">Растянуть</option><option value="1">Приблизить</option></select></div>
    <div class="actions">
      <label class="btn ghost" for="file">Загрузить фото</label>
      <input id="file" type="file" accept="image/*" hidden>
      <button class="primary" id="dl">Скачать PNG</button>
      <button class="ghost" id="reset">Сбросить</button>
    </div>
    <p class="meta" id="info"></p>
    <p class="hint">Если кнопка скачивания заблокирована в вашем просмотрщике, нажмите на превью правой кнопкой и выберите «Сохранить изображение как». Центр искажения можно двигать перетаскиванием по превью.</p>
  </aside>
</div>

<script>
const $=id=>document.getElementById(id);
const canvas=$('c'), gl=canvas.getContext('webgl',{preserveDrawingBuffer:true,premultipliedAlpha:false});
const VS='attribute vec2 p;varying vec2 v;void main(){v=p*.5+.5;gl_Position=vec4(p,0,1);}';
const FS=`precision highp float;varying vec2 v;uniform sampler2D t;
uniform float k,ab,asp,zoom,mode,n;uniform vec2 c;
vec3 spec(float x){ // wavelength-ish weight: x in [-1,1] -> rgb
  return vec3(clamp(x+.5,0.,1.),1.-abs(x),clamp(-x+.5,0.,1.))+.02;}
vec2 warp(vec2 uv,float s){
  vec2 d=(uv-c)*vec2(asp,1.); float r2=dot(d,d);
  d*= (1.+k*r2*1.4)*zoom*s; d/=vec2(asp,1.); return c+d;}
void main(){
  vec3 acc=vec3(0.),w=vec3(0.);
  for(int i=0;i<24;i++){ if(float(i)>=n)break;
    float x=n>1.?float(i)/(n-1.)*2.-1.:0.;
    vec2 uv=warp(v,1.);
    vec2 d=(uv-c);
    if(mode<.5){uv=c+d*(1.+ab*.06*x);}
    else{ float a=float(i)*2.39996; uv+=vec2(cos(a),sin(a))*ab*.012*abs(x)*(0.3+length(v-c)*2.);}
    vec3 sw=spec(x);
    acc+=texture2D(t,clamp(uv,0.,1.)).rgb*sw; w+=sw;
  }
  gl_FragColor=vec4(acc/w,1.);
}`;
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(s));return s;}
const pg=gl.createProgram();gl.attachShader(pg,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pg,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pg);gl.useProgram(pg);
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(pg,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(pg,n);
const tex=gl.createTexture();let W=1200,H=800;
function setImage(src,name){
  const maxT=Math.min(gl.getParameter(gl.MAX_TEXTURE_SIZE),4096);
  const sc=Math.min(1,maxT/Math.max(src.width,src.height));
  W=Math.round(src.width*sc);H=Math.round(src.height*sc);
  const tmp=document.createElement('canvas');tmp.width=W;tmp.height=H;tmp.getContext('2d').drawImage(src,0,0,W,H);
  gl.bindTexture(gl.TEXTURE_2D,tex);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,tmp);
  [gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER].forEach(p=>gl.texParameteri(gl.TEXTURE_2D,p,gl.LINEAR));
  [gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T].forEach(p=>gl.texParameteri(gl.TEXTURE_2D,p,gl.CLAMP_TO_EDGE));
  canvas.width=W;canvas.height=H;canvas.style.setProperty('--ar',W/H);$('info').textContent=(name||'Тестовое изображение')+' · '+W+'×'+H+' px';render();
}
const st={cx:.5,cy:.5};
function render(){
  gl.viewport(0,0,W,H);
  const k=+$('dist').value;
  gl.uniform1i(U('t'),0);gl.uniform1f(U('k'),k);gl.uniform1f(U('ab'),+$('aber').value);
  gl.uniform1f(U('asp'),W/H);gl.uniform2f(U('c'),st.cx,1-st.cy);
  gl.uniform1f(U('mode'),+$('mode').value);gl.uniform1f(U('n'),+$('qual').value);
  // zoom<1 samples a smaller area so barrel edges stay inside the frame
  gl.uniform1f(U('zoom'),$('fit').value==='1'?1/(1+Math.max(0,k)*1.4*.5)*(k<0?1/(1+k*1.4*.5):1):1);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}
function sample(){
  const c=document.createElement('canvas');c.width=1200;c.height=800;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,1200,800);g.addColorStop(0,'#ff8a5b');g.addColorStop(.5,'#6c5ce7');g.addColorStop(1,'#00c2c7');
  x.fillStyle=g;x.fillRect(0,0,1200,800);
  x.strokeStyle='rgba(255,255,255,.55)';x.lineWidth=2;
  for(let i=0;i<=1200;i+=100){x.beginPath();x.moveTo(i,0);x.lineTo(i,800);x.stroke();}
  for(let j=0;j<=800;j+=100){x.beginPath();x.moveTo(0,j);x.lineTo(1200,j);x.stroke();}
  x.fillStyle='#fff';x.font='700 150px Onest,sans-serif';x.textAlign='center';x.textBaseline='middle';
  x.fillText('ЛИНЗА',600,330);x.fillStyle='#111';x.fillRect(240,470,720,14);x.fillRect(240,520,420,14);
  x.fillStyle='#fff';
  x.font='500 28px JetBrains Mono,monospace';x.fillText('загрузите фото, чтобы заменить тестовое изображение',600,620);
  return c;
}
function sync(a,b,fmt){a.addEventListener('input',()=>{b.value=fmt?fmt(a.value):a.value;render();});}
['dist','aber'].forEach(id=>{
  const r=$(id),n=$(id+'_n');
  r.addEventListener('input',()=>{n.value=(+r.value).toFixed(2).replace(/0$/,'').replace(/\.$/,'');render();});
  n.addEventListener('change',()=>{const v=Math.max(+r.min,Math.min(+r.max,parseFloat(n.value)||0));r.value=v;n.value=v;render();});
});
['cx','cy'].forEach(id=>$(id).addEventListener('change',e=>{
  const v=Math.max(0,Math.min(100,parseFloat(e.target.value)||50));st[id]=v/100;e.target.value=Math.round(v)+'%';render();}));
['mode','qual','fit'].forEach(id=>$(id).addEventListener('change',render));
$('reset').onclick=()=>{$('dist').value=.5;$('aber').value=.2;$('dist_n').value='0.5';$('aber_n').value='0.2';
  st.cx=st.cy=.5;$('cx').value=$('cy').value='50%';$('mode').value=0;$('qual').value=12;$('fit').value=0;render();};
$('file').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const url=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{setImage(im,f.name);URL.revokeObjectURL(url);};im.src=url;});
$('dl').onclick=()=>canvas.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='lens-distortion.png';document.body.appendChild(a);a.click();a.remove();},'image/png');
function drag(e){const r=canvas.getBoundingClientRect();
  st.cx=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));st.cy=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));
  $('cx').value=Math.round(st.cx*100)+'%';$('cy').value=Math.round(st.cy*100)+'%';render();}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);drag(e);canvas.onpointermove=drag;});
canvas.addEventListener('pointerup',()=>canvas.onpointermove=null);
canvas.style.touchAction='none';
const start=()=>setImage(sample());
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(start);
</script>

</body>
</html>
