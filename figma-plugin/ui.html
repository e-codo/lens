<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lens distortion</title>
<style>
:root{
  --bg:var(--figma-color-bg,#2c2c2c); --fg:var(--figma-color-text,#fff); --muted:var(--figma-color-text-secondary,#a0a0a0);
  --field:var(--figma-color-bg-secondary,#383838); --line:var(--figma-color-border,#444); --accent:var(--figma-color-bg-brand,#0d99ff);
  --stage:var(--figma-color-bg-tertiary,#1e1e1e);
  --font:Inter,system-ui,-apple-system,'Segoe UI',sans-serif; --mono:ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:12px/1.4 var(--font);padding:12px;display:flex;flex-direction:column;gap:12px}
.stage{background:var(--stage);border-radius:8px;display:grid;place-items:center;padding:10px;min-height:150px;position:relative}
.frame{position:relative;--ar:1.5;aspect-ratio:var(--ar);width:min(100%,calc(240px * var(--ar)));touch-action:none;cursor:crosshair}
canvas{width:100%;height:100%;display:block;border-radius:3px}
.pin{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.5);pointer-events:none}
.pin::after{content:"";position:absolute;inset:5px;border-radius:50%;background:#fff}
.frame.cmp .pin{opacity:0}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px;color:var(--muted)}
.meta{font:11px var(--mono);color:var(--muted);overflow-wrap:anywhere}
.ctl{display:flex;flex-direction:column;gap:6px}
.ctl-h{display:flex;justify-content:space-between;align-items:center;gap:6px}
.mini{display:flex;gap:6px;align-items:center}
.val{font:11px var(--mono);color:var(--fg);background:var(--field);border:1px solid transparent;border-radius:5px;padding:4px 6px;width:56px;text-align:right}
.val:focus{outline:1px solid var(--accent)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:none;margin:0;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:99px;background:linear-gradient(90deg,var(--accent) var(--p),var(--field) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 1px rgba(0,0,0,.25),0 1px 4px rgba(0,0,0,.4)}
.xy{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.xy div{display:flex;align-items:center;gap:6px;background:var(--field);border-radius:5px;padding:0 8px;color:var(--muted);font:11px var(--mono)}
.xy input{width:100%;min-width:0;background:none;border:0;color:var(--fg);font:11px var(--mono);padding:6px 0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--field);border-radius:6px;padding:2px;gap:2px}
.seg button{border:0;background:none;color:var(--muted);font:inherit;padding:5px 2px;border-radius:5px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--fg)}
.btn{font:600 12px var(--font);border:0;border-radius:6px;padding:9px 10px;cursor:pointer;background:var(--field);color:var(--fg);user-select:none}
.btn.primary{background:var(--accent);color:#fff;width:100%}
.btn.primary:disabled{opacity:.4;cursor:default}
.chip{border:0;border-radius:5px;padding:3px 8px;font:600 11px var(--font);background:var(--field);color:var(--accent);cursor:pointer}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
label{font-weight:500}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
</style>
</head>
<body>
<div class="stage">
  <div class="frame" id="frame" hidden><canvas id="c" width="300" height="200"></canvas><span class="pin" id="pin"></span></div>
  <div class="empty" id="empty">Выделите слой или фрейм в Figma</div>
</div>
<div class="meta" id="info"></div>
<div class="ctl"><div class="ctl-h"><label for="dist">Искажение</label><input class="val" id="dist_n" value="0.5" aria-label="Значение искажения"></div><input id="dist" type="range" min="-1" max="1" step="0.01" value="0.5" data-def="0.5"></div>
<div class="ctl"><div class="ctl-h"><label for="aber">Аберрация</label><input class="val" id="aber_n" value="0.2" aria-label="Значение аберрации"></div><input id="aber" type="range" min="0" max="1" step="0.01" value="0.2" data-def="0.2"></div>
<div class="ctl"><div class="ctl-h"><label for="scale">Масштаб</label><span class="mini"><button type="button" class="chip" id="auto">Авто</button><input class="val" id="scale_n" value="100%" aria-label="Значение масштаба"></span></div><input id="scale" type="range" min="1" max="2" step="0.01" value="1" data-pct="1" data-def="1"></div>
<div class="ctl"><div class="ctl-h"><label for="rad">Радиус</label><input class="val" id="rad_n" value="100%" aria-label="Значение радиуса"></div><input id="rad" type="range" min="0.1" max="1" step="0.01" value="1" data-pct="1" data-def="1"></div>
<div class="ctl"><label>Центр</label><div class="xy"><div>X<input id="cx" value="50%" aria-label="Центр по X"></div><div>Y<input id="cy" value="50%" aria-label="Центр по Y"></div></div></div>
<div class="ctl"><label>Режим</label><div class="seg" data-for="mode"><button type="button" data-v="0">Боковая</button><button type="button" data-v="1">Осевая</button></div><input type="hidden" id="mode" value="0"></div>
<div class="ctl"><label>Качество</label><div class="seg" data-for="qual"><button type="button" data-v="6">Низкое</button><button type="button" data-v="12">Среднее</button><button type="button" data-v="24">Высокое</button></div><input type="hidden" id="qual" value="12"></div>
<div class="row"><button class="btn" id="cmp" type="button">Оригинал</button><button class="btn" id="reset" type="button">Сбросить</button></div>
<button class="btn primary" id="apply" type="button" disabled>Создать слой рядом</button>

<script>
const $=id=>document.getElementById(id);
const canvas=$('c'), frame=$('frame'), gl=canvas.getContext('webgl',{preserveDrawingBuffer:true,premultipliedAlpha:false});
const VS='attribute vec2 p;varying vec2 v;void main(){v=p*.5+.5;gl_Position=vec4(p,0,1);}';
const FS=`precision highp float;varying vec2 v;uniform sampler2D t;
uniform float k,ab,asp,zoom,mode,n,rad;uniform vec2 c;
vec3 spec(float x){return vec3(clamp(x+.5,0.,1.),1.-abs(x),clamp(-x+.5,0.,1.))+.02;}
float mask(vec2 uv){
  if(rad>.999)return 1.;
  vec2 d=(uv-c)*vec2(asp,1.);
  float rn=length(d)/(length(vec2(asp,1.))*.5);
  float L=rad*2.;
  return 1.-smoothstep(L*.35,L,rn);}
vec2 warp(vec2 uv){
  vec2 d=(uv-c)*vec2(asp,1.); float r2=dot(d,d);
  d*=(1.+k*mask(uv)*r2*1.4)*zoom; d/=vec2(asp,1.); return c+d;}
void main(){
  vec3 acc=vec3(0.),w=vec3(0.);
  for(int i=0;i<24;i++){ if(float(i)>=n)break;
    float x=n>1.?float(i)/(n-1.)*2.-1.:0.;
    vec2 uv=warp(v);
    vec2 d=(uv-c);
    float am=ab*mask(v);
    if(mode<.5){uv=c+d*(1.+am*.06*x);}
    else{ float a=float(i)*2.39996; uv+=vec2(cos(a),sin(a))*am*.012*abs(x)*(0.3+length(v-c)*2.);}
    vec3 sw=spec(x);
    acc+=texture2D(t,clamp(uv,0.,1.)).rgb*sw; w+=sw;
  }
  gl_FragColor=vec4(acc/w,1.);
}`;
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(s));return s;}
const pg=gl.createProgram();gl.attachShader(pg,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pg,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pg);gl.useProgram(pg);
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(pg,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(pg,n);
const tex=gl.createTexture();let W=1200,H=800,bypass=false;
const st={cx:.5,cy:.5};
function setImage(src,name){
  const maxT=Math.min(gl.getParameter(gl.MAX_TEXTURE_SIZE),4096);
  const sc=Math.min(1,maxT/Math.max(src.width,src.height));
  W=Math.round(src.width*sc);H=Math.round(src.height*sc);
  const tmp=document.createElement('canvas');tmp.width=W;tmp.height=H;tmp.getContext('2d').drawImage(src,0,0,W,H);
  gl.bindTexture(gl.TEXTURE_2D,tex);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,tmp);
  [gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER].forEach(p=>gl.texParameteri(gl.TEXTURE_2D,p,gl.LINEAR));
  [gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T].forEach(p=>gl.texParameteri(gl.TEXTURE_2D,p,gl.CLAMP_TO_EDGE));
  canvas.width=W;canvas.height=H;frame.style.setProperty('--ar',W/H);
  $('info').textContent=(name||'Тестовое изображение')+' · '+W+'×'+H+' px';render();
}
function render(){
  gl.viewport(0,0,W,H);
  const k=bypass?0:+$('dist').value, ab=bypass?0:+$('aber').value;
  gl.uniform1i(U('t'),0);gl.uniform1f(U('k'),k);gl.uniform1f(U('ab'),ab);
  gl.uniform1f(U('asp'),W/H);gl.uniform2f(U('c'),st.cx,1-st.cy);
  gl.uniform1f(U('mode'),+$('mode').value);gl.uniform1f(U('n'),bypass?1:+$('qual').value);
  gl.uniform1f(U('rad'),bypass?1:+$('rad').value);gl.uniform1f(U('zoom'),bypass?1:1/+$('scale').value);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  $('pin').style.left=st.cx*100+'%';$('pin').style.top=st.cy*100+'%';
}

function paint(r){const p=(r.value-r.min)/(r.max-r.min)*100;r.style.setProperty('--p',p+'%');}
const fmt=r=>r.dataset.pct?Math.round(r.value*100)+'%':(+r.value).toFixed(2).replace(/0$/,'').replace(/\.$/,'');
['dist','aber','scale','rad'].forEach(id=>{
  const r=$(id),n=$(id+'_n'),pct=!!r.dataset.pct;paint(r);
  r.addEventListener('input',()=>{n.value=fmt(r);paint(r);render();});
  n.addEventListener('change',()=>{let v=parseFloat(n.value.replace(',','.'));if(isNaN(v))v=+r.dataset.def||0;if(pct)v/=100;
    v=Math.max(+r.min,Math.min(+r.max,v));r.value=v;n.value=fmt(r);paint(r);render();});
});
// smallest scale at which the warped frame never samples outside the photo
function autoScale(){
  const k=+$('dist').value,ab=+$('aber').value,R=+$('rad').value,asp=W/H,hd=Math.hypot(asp,1)*.5;
  const m=(x,y)=>{if(R>.999)return 1;const rn=Math.hypot((x-st.cx)*asp,y-st.cy)/hd,L=R*2,t=Math.min(1,Math.max(0,(rn-L*.35)/(L*.65)));return 1-t*t*(3-2*t);};
  let need=1;const N=60;
  for(let i=0;i<=N;i++){const t=i/N;for(const[x,y]of[[t,0],[t,1],[0,t],[1,t]]){
    const dx=(x-st.cx)*asp,dy=y-st.cy,g=(1+k*m(x,y)*(dx*dx+dy*dy)*1.4)*(1+ab*m(x,y)*.06);
    // want c+(p-c)*g/scale inside [0,1] on both axes
    for(const[p,cc]of[[x,st.cx],[y,st.cy]]){const o=Math.abs(p-cc)*g,room=(p>=cc?1-cc:cc);if(room>0)need=Math.max(need,o/room);}}}
  return Math.min(2,Math.max(1,need));
}
$('auto').onclick=()=>{const r=$('scale');r.value=Math.ceil(autoScale()*100)/100;$('scale_n').value=fmt(r);paint(r);render();};
['cx','cy'].forEach(id=>$(id).addEventListener('change',e=>{
  const v=Math.max(0,Math.min(100,parseFloat(e.target.value)||50));st[id]=v/100;e.target.value=Math.round(v)+'%';render();}));
document.querySelectorAll('.seg').forEach(g=>{
  const inp=$(g.dataset.for);
  const sync=()=>g.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===inp.value));
  g.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;inp.value=b.dataset.v;sync();render();});
  g._sync=sync;sync();
});
$('reset').onclick=()=>{
  $('dist').value=.5;$('aber').value=.2;$('dist_n').value='0.5';$('aber_n').value='0.2';$('scale').value=1;$('rad').value=1;$('scale_n').value=$('rad_n').value='100%';
  ['dist','aber','scale','rad'].forEach(i=>paint($(i)));
  st.cx=st.cy=.5;$('cx').value=$('cy').value='50%';$('mode').value=0;$('qual').value=12;
  document.querySelectorAll('.seg').forEach(g=>g._sync());render();};
const cmp=$('cmp');
const on=e=>{e.preventDefault();bypass=true;frame.classList.add('cmp');render();};
const off=()=>{if(!bypass)return;bypass=false;frame.classList.remove('cmp');render();};
cmp.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(t=>cmp.addEventListener(t,off));
function drag(e){const r=frame.getBoundingClientRect();
  st.cx=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));st.cy=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));
  $('cx').value=Math.round(st.cx*100)+'%';$('cy').value=Math.round(st.cy*100)+'%';render();}
frame.addEventListener('pointerdown',e=>{frame.setPointerCapture(e.pointerId);drag(e);frame.onpointermove=drag;});
frame.addEventListener('pointerup',()=>frame.onpointermove=null);

let hasImage=false,busy=false;
function post(msg){parent.postMessage({pluginMessage:msg},'*');}
$('apply').onclick=()=>{
  if(!hasImage||busy)return;busy=true;$('apply').disabled=true;$('apply').textContent='Создаю слой…';
  bypass=false;render();
  canvas.toBlob(b=>b.arrayBuffer().then(buf=>post({type:'apply',bytes:new Uint8Array(buf)})),'image/png');
};
window.onmessage=async e=>{
  const m=e.data&&e.data.pluginMessage;if(!m)return;
  if(m.type==='image'){
    const bmp=await createImageBitmap(new Blob([m.bytes],{type:'image/png'}));
    hasImage=true;$('empty').hidden=true;frame.hidden=false;
    setImage(bmp,m.name);
    $('apply').disabled=busy;
  }else if(m.type==='empty'){
    hasImage=false;frame.hidden=true;$('empty').hidden=false;$('empty').textContent=m.message;$('info').textContent='';$('apply').disabled=true;
  }else if(m.type==='applied'){
    busy=false;$('apply').textContent='Создать слой рядом';$('apply').disabled=!hasImage;
  }
};
document.querySelectorAll('input[type=range]').forEach(paint);
post({type:'ready'});
</script>
</body>
</html>
